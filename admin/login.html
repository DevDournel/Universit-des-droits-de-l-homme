<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    if (window.location.port === "5500") {
      window.location.replace(new URL(window.location.pathname + window.location.search + window.location.hash, "http://localhost:8000").href);
    }
  </script>
  <title>Connexion | Administration UDDH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="../images/fav%20icone.png">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand login-brand"><span class="brand-mark">U</span><span><strong>UDDH</strong><small>Administration</small></span></div>
    <h1>Connexion</h1>
    <p class="text-muted">Accédez à la gestion de votre site.</p>
    <form id="login-form">
      <div class="mb-3"><label class="form-label" for="username">Identifiant</label><input class="form-control" id="username" autocomplete="username" required></div>
      <div class="mb-3"><label class="form-label" for="password">Mot de passe</label><input class="form-control" id="password" type="password" autocomplete="current-password" required></div>
      <div class="alert alert-danger d-none" id="login-error" role="alert"></div>
      <button class="btn btn-primary w-100" type="submit">Se connecter</button>
    </form>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const error = document.getElementById("login-error");
      error.classList.add("d-none");
      const response = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: document.getElementById("username").value, password: document.getElementById("password").value }) });
      const result = await response.json();
      if (!response.ok) { error.textContent = result.error; error.classList.remove("d-none"); return; }
      window.location.href = "/admin/index.html";
    });
  </script>
</body>
</html>
